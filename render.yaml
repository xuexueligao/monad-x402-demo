services:
  - type: web
    name: monad-rug-arena
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start:cloud
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: ARENA_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: ARENA_CHAIN_ID
        value: "10143"
      - key: NEXT_PUBLIC_MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: ARENA_CONTRACT_ADDRESS
        value: "0xc998eb98453f4c26Aba98D369E8C3895b8061085"
      - key: ARENA_DEPLOYMENT_BLOCK
        value: "71762027"
      - key: ARENA_RESULT_SIGNER_PRIVATE_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.apipod.ai/v1
      - key: AI_MODEL
        value: deepseek-flash
      - key: ARENA_CHALLENGE_FEE_MON
        value: "10"
      - key: ARENA_POOL_SHARE_BPS
        value: "8000"
      - key: ARENA_REWARD_BPS
        value: "5000"
      - key: ARENA_ROUND_DURATION_SECONDS
        value: "7200"
